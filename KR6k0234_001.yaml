body:
  text: 廣州寶象林沙門弘贊在犙輯如來御世本為利樂一切衆生而衆生根性不同故教設多方教雖非一而不出三學所謂戒定慧也然定慧多門戒列七衆出家則比丘稟受二百五十大戒比丘尼受持三百四十八戒式叉摩那學其六法沙彌沙彌尼俱持十戒在家則清信男清信女戒開兩門一五戒終身持二八戒六齋日持或十齋日持或隨自意有暇日即持然戒雖云一日一夜其所獲功德利益非凡所測如摩尼寶珠雖復輕小而勝一切諸寶有斯善利捨而不為者有二種人一者不信三世善惡因果在儒不修五常寧信如來出世五戒由是人天路絶道果無分二者頑癡無知不識君臣父子孝悌忠信惟知食息畜生無異寧曉遷善是二種人枉得人身一生無善可記肆意非為一朝業果現前追悔何及其有智者速宜受持阿含經云佛言若善男子善女人欲得八關齋離諸苦者得盡諸漏入涅槃城當求方便成此八齋人中榮位不足為貴天上快樂不可稱計欲求無上之福者當求此齋欲生六欲天色無色界天者當持此齋欲求一方二方三方四方天子轉輪聖王位者亦獲其願欲求聲聞緣覺佛乘者悉成其願吾今成就皆由持戒八戒十善無願不獲若受八齋首須懺悔先罪然後受戒應生慚愧發懇切心作如是言我某甲從無始生死已來至於今日身業不善殺盜淫口業不善妄言綺語兩舌惡口意業不善貪欲瞋恚愚癡邪見不信因果造此十不善罪今向十方三寶諸佛菩薩三乘聖衆現前師僧求哀懺悔作如是懺已教受言我某甲歸依佛歸依法歸依僧一日一夜為淨行優婆塞女人當云優婆夷如來至真等正覺是我世尊三説已次受三結我某甲歸依佛竟歸依法竟歸依僧竟一日一夜為淨行優婆塞如來至真等正覺是我世尊三説已次受戒相如諸佛盡壽不殺生我某甲一日一夜不殺生如諸佛盡壽不偷盜我某甲一日一夜不偷盜如諸佛盡壽不淫欲我某甲一日一夜不淫欲如諸佛盡壽不妄語我某甲一日一夜不妄語如諸佛盡壽不飲酒我某甲一日一夜不飲酒如諸佛盡壽不著香華鬘不香塗身我某甲一日一夜不著香華鬘不香塗身如諸佛盡壽不歌舞倡伎不往聽觀我某甲一日一夜不歌舞倡伎不往觀聽如諸佛盡壽不坐高廣大牀我某甲一日一夜不坐高廣大牀如諸佛盡壽不非時食我某甲一日一夜不非時食經云如上次第授已當教發願大論云當發願言我某甲受行八戒隨學諸佛名為布薩願持是福不墮三惡八難亦不求輪王梵王世間之樂願斷煩惱逮得一切智成就佛道若欲兼報四恩求生淨土者當作如是發願言我今以此八關戒齋功德四恩總報三有齊資普與衆生同生淨土此八關戒亦名八支戒又名八種長養功德法前之八法名為關戒後一不非時食名之為齋齋戒合名故云八關戒齋關謂關閉八惡不起諸過齋者齊也謂禁止六情不染六塵齊斷諸惡具修衆善故名齋也大方便經云優波離白佛言夫八齋法并過中不食乃有九法何以八事得名佛言齋法過中不食為體八事助成齋體共相支持名八支齋法是故言八齋不云九也不殺生者下至微細蜫蟲但有命者不得故殺不偷盜者乃至一針一線他不與者不取不淫欲者世間一切男女及自妻妾一日一夜悉皆遠離不妄語者妄語有四謂妄語綺語兩舌惡口但與心口相違者悉名妄語不飲酒者謂一切五穀華果釀成能醉人者皆不得飲不著香華鬘不香塗身者謂不得以諸華貫串為鬘名香為末熏佩塗飾及著一切莊嚴衣具等不歌舞倡伎不往觀聽者倡伎是樂器謂自不習歌曲戲舞作諸妓樂樗蒲棋博等及他人作時亦不往觀聽不坐高廣大牀者高不過尺六廣闊不過四尺長大不過八尺及一切嚴麗莊校牀座皆不於中坐臥也不非時食者謂不過日中噉嚼五穀瓜果等物若日過西一線乃至明日天未曉皆名非時經云諸天早食佛日中食畜生日西食鬼神夜食今受八戒斷六道因學佛中食以表中道離斷常二邊之過也食訖須嚼楊枝淨水嗽口去口中餘津若不嚼楊枝口中餘津尚存而咽者即犯非時如無楊枝除毒樹一切桃槐苦澀等樹皆可用之五辛之物俱不得食此八戒齋若犯前四是實惡性罪也飲酒是衆惡之門後四是放逸因緣若人離前五種惡是福因緣離餘四種是道因緣報恩經云若破八戒中重戒後更受八戒或受五戒或受十戒或大戒及禪戒無漏戒一切不得問曰受八戒法得二日三日乃至十日一時受不答曰佛本制一日一夜戒不得過限若有力能受一日過已次第更受如是隨力多少不計日數夫受齋法必從他人邊受謂於五衆邊受故婆沙論問曰近住八戒云何而得答曰從他教得謂從師教自發誠言恭敬受得又受戒者要隨師語如師説而説方得受戒若先自發言或與師俱説不得戒問曰著何服飾得受此戒答曰常所受用衣服嚴具著之皆得受若為暫時莊嚴身者必須棄捨受時應齊一日夜不增不減謂清旦時從師受得至明清旦此齋便捨問曰若至午後受此戒者亦得戒不答曰應言不得除先有要期每月六日等恆受齋戒彼有餘緣午前不憶食已方憶深生慚愧即請戒師如法受者亦得薩婆多論云必無戒師為授者但心念口言自歸三寶我持八戒亦得若近處有戒師心生慢墯不往從受而自受者亦不得戒俱舍論云若不恭敬不發戒體若不如法受者但生善行不發戒體故優婆塞戒經云不得在佛像前自受要從人受根本清淨受已清淨莊嚴清淨覺觀清淨念心清淨求報清淨是名三歸清淨齋法若能歸依受八戒者除五逆罪餘一切惡悉皆消滅若有人以四大寶藏滿中七寶持布施人所有功德不如有人一日一夜受持八戒得無量果報至涅槃樂雜譬喻經云一日持齋有六十萬歲餘糧非時不食復有五福一少病二身安三少淫四少睡五生天識宿命舍迦經云月六齋日奉持八戒福不可計若人急欲得三乘聖道者當端其心一其意受持八戒得大善利智度論云若臘月一日至十五日受持此戒其福最多此是如來現大神通日也又云五戒一日戒何者為勝答曰有因緣故二戒俱等但五戒終身持八戒一日持又五戒常持時多而戒少一日戒時少而戒多若無大心雖復終身持不如有大心持一日戒譬如軟夫為將雖欲將兵終身卒無功名若英雄奮發禍亂立定一日之勳名蓋天下八戒比於餘戒亦復如是問曰何故六日受八戒修福德答曰是日鬼神逐人欲奪人命疾病凶衰令人不吉是故劫初聖賢教人持齋修福以避凶衰是時不知有八戒直以一日不食為齋佛後出世始教一日一夜受持八戒過中不食為齋如是功德將人至涅槃樂四天王經云月六齋日天使者太子及四天王自下觀察衆生若不布施持戒忠孝者便上忉利天以啓天帝時天帝及諸天心皆不悅説言惡道增多諸天衆減少矣若有布施持戒忠孝多者諸天歡喜説言天衆增益惡道減損矣涅槃經云佛告大王波羅奈國有一屠兒名曰廣額於日日中殺無量羊見舍利弗即受八戒經一日一夜以是因緣命終得為北方多聞天王作子賢愚經云北天竺阿槃提國中有一老婢晨夜走使不得安處小有違失便受鞭捶衣不蔽形食不充口年老困悴思死不得持瓶詣河取水思惟是苦舉聲大哭時迦旃延尊者來至其所問言何以悲泣懊惱乃爾白言尊者我既年老恆執苦役加復貧窮衣食不充思死不得是故哭耳尊者曰汝若貧者何不賣貧婢言貧那得賣誰當買貧尊者曰貧實可賣如是至三婢言苟貧可賣我宜問方大德貧云何賣尊曰審欲賣者一隨我語答言諾尊者告曰汝先洗浴洗已告曰汝當布施白言尊者我極貧困身無手許完納唯有此瓶是主人的當以何施尊者即持鉢與之汝持此鉢取少淨水如教取來奉上尊者尊者受已尋為呪願次教受八戒齋後教念佛種種功德問曰汝有住止處不答言無也若磨時即磨下臥舂炊作使即臥其中或時無作止宿糞堆尊者曰汝好持心恭謹走使莫生嫌恨自伺主人一切臥竟密開其門於門曲內敷淨草坐思惟觀佛莫生惡念時老婢奉教歸家依敕施行於後夜中即便命終生忉利天上主人早起見婢命終瞋言此婢恆常不聽入舍今暮何故乃於此死即使人以草索繫腳拽至林中此女既生天上與五百天子娛樂時舍利弗尊者在忉利天問曰汝因何福生此天中答言不知舍利弗即借其道眼觀其故身生天因緣由迦旃延即將五百天子來至林中散華燒香供養死尸諸天身光照耀村林主人見已怪其所由與衆詣林觀看見諸天子供養此尸即問天曰此婢醜穢生存之時人猶惡見況今已死何故諸天而加供養時天子具説本末生天因緣即回詣迦旃延所尊者為諸天人廣説妙法所謂持戒生天之論欲不淨法出離為樂時彼天及五百天子得須陀洹果飛還天宮時在會衆聞法已各獲道果莫不歡喜奉行迦旃延以天眼觀見此婢餘有一夜命在死即墮惡道受無量苦故往度之法句喻經云東方有國名鬱多羅波提有婆羅門五百人相率欲詣恆水邊詞祀神池沐浴垢穢裸形求仙路出大澤迷不得過中路乏糧遙見一大樹如有神氣想有人居馳聚樹下了無所見舉聲大哭云飢渴委厄窮死斯澤矣樹神現身問曰道士那來今欲何行同聲答曰欲詣神池澡浴求仙今日飢渴幸哀矜濟樹神舉手百味飲食從手流溢給衆飲食皆得飽滿其餘飲食足供路糧臨別詣神請問曰本行何德致此巍巍神曰吾本所居在舍衛國時國大臣名曰須達飯佛衆僧於市買酪無提酪者倩我提之往到精舍使我斟酌訖行澡水儼然聽法一切歡喜稱善無量時我奉齋暮還不餐婦怪問我不審何恨我曰不恨也見長者須達飯佛我奉戒齋齋名八關時婦瞋忿言曰瞿曇亂俗奚足採納君毀遺則禍從此興踧迫不已便共俱食時我壽盡神來生此為此愚婦破我齋法不卒其業來生斯澤作此樹神提酪之福手出飲食若全齋法應生天上封受自然即為五百人而説頌曰祠祀種禍根日夜長枝條唐苦敗身本法齋度世仙按賢愚經及百緣經云昔迦葉佛滅度之後遺法垂末有二梵志到比丘邊俱受八戒一願生天一願作國王願生天者歸家婦呼共食夫言向受佛齋過中不食婦曰君是梵志自有戒法何緣乃受異道之齋今若相違不共我飯當以斯事語諸梵志擯汝不與同會夫聞恐怖便與婦非時而食由破齋故後生龍中其願作王者持齋完具得生王家作大國王時王園中多有甘果守園之人日日奉送其人後時於園泉中得一異奈色香甚美便作是念我每出入常為門監所遮當以此奈與之門監得已奉貢黃門黃門納竟轉上夫人夫人得奈復用獻王王食此奈甚覺甘美便問夫人展轉相推到守園人王即喚來而責之曰如此美奈何為不送乃與他人園人於是具陳本末王瞋語言自今以後常送斯奈園監啓王此奈無種何由可辦王曰若不能得當斬汝身其人還園舉聲大哭其龍先身與王共受齋故生於王園泉中時龍變身為人從泉而出問其哭由園監具説龍聞入水以金盤盛奈出泉遣持奉王并語吾意云吾及王本是親友昔在世時俱為梵志共受八戒各求所願汝戒完具得為人王吾戒不全故生龍中今欲奉八關齋法求捨此身當為吾覓八關齋文持來與我若其相違吾覆汝國用作大海園監以奈奉王具説龍意王聞甚憂良由時世無佛法又滅盡齋文難得有一大臣王敕之曰龍索齋法仰卿得之若不得者吾當殺卿大臣歸家甚懷憂惱臣父見子面色不悅問知委由其父語曰吾家堂柱每放光明試破看之必有異事尋即破之得經二卷一是十二因緣二是八關齋文得已奉王王得歡喜自送與龍龍得此經便用好寶贈王王及於龍重修八戒壽盡生天同共一處至釋迦如來出世從天來下至於佛所佛為説法時二天子俱得須陀洹果還歸天上從是以往畢得涅槃按此八戒無論已受五戒未受五戒皆得受之或六齋日自誕日或父母生日諱日等皆可受持以資福慧為出世之基也若受戒已或遇破戒難緣相逼寧可捨戒已然後作之不得犯戒罪後還得受戒欲捨戒時無問出家在家人邊但向一人言我今捨八戒不持一説即成捨也餘詳歸戒集中附吳王孫皓拜沙門僧康會受戒齊武帝永平元年帝幸華林園設八關齋戒帝微時避難揭陽山中纍石為浮圖忽有一樹生其側狀如華蓋後帝不豫詔諸沙門祈佛七日天香滿殿齊文宣帝登祚受禪於僧稠禪師受菩薩戒畿內禁酒放鷹除網又斷天下屠宰年正五九月六齋日勸民齋戒公私葷辛悉除滅之梁高祖武帝造光宅同泰寺國內普持六齋八戒周孝宣帝重隆佛日造素像四龕一萬餘軀寫般若經二千卷六齋八戒常弘不絶梁太宗簡文帝造茲敬報恩二寺刺血自寫般若經十部願忌日不食而齋魏孝武文帝諱日上中興寺建八關齋中食竟從臣袁敏孫等更進魚肉帝怒並與免官詔六宮舍女皆持年三長齋月六日齋戒陳皇太子淵後主子也至德四年正月十五日於崇正殿設千僧齋請智者大師授菩薩戒百録請戒文名淵南史名深恐因請戒改此名陳武帝詔智者師大赴崇正殿為皇太子授菩薩戒隋文帝開皇十年歲旱詔曇延法師率衆祈雨雨不降帝問何故對曰事由一二帝遣京尹蘇成問一二之意延曰陛下躬萬機之政羣臣致股肱之力雖通治體然俱愆玄化欲雨不雨事由一二也帝識其意敕有司擇日於正殿設儀請延升御座授八戒羣臣以次受訖方炎如焚而大雨沛然傾注帝悅自是延每入朝必親手奉御饌供之詔興法師入太興殿授菩薩戒復詔天下正五九月及六齋日不得殺生命開皇十三年冬十月智者大師過嶽州為刺史王宣武授戒法沙門曇捷等請講金光明經其俗聞法感化一郡五縣一千餘所咸捨漁捕陳永陽王伯智字䇿之文帝第八子至德初出為東陽刺史請智者大師出鎮開講致書至三師遂往王與子湛家人同稟菩薩戒晝聆講説夜習坐禪講事將解立法名曰靜智晉簡文帝有烏巢太極殿召尼道容授八關齋戒烏運巢而去晉王迎智者大師至楊州設千僧齋授菩薩戒唐太宗詔常法師入內殿為皇后太子授菩薩戒顯慶元年十一月武后生皇太子神光滿室賜名佛光王即中宗也踰月詔玄奘法師送寺出家落髮受三歸五戒中宗詔道岸律師入宮為妃主受歸戒玄宗日本國沙門榮睿至陽州請律師鑒真與睿附舶而去既至日本王迎勞問館于毗盧殿請授歸戒日本戒律始此侍郎白居易字樂天自號香山居士嘗勸一百四十八人結上生會在鉢塔寺依如大師授八關齋戒九度音釋布薩此云淨住又云天語淨住人語或云精進亦云長養通僧及俗俱稟修行所謂淨身口意如戒而住也六齋日此以上半月下半月各三日言之上半月三日初八十四十五下半月三日二十三日即上半月初八日二十九三十日即上半月十四十五日十齋日初一初八十四十五十八二十三二十四二十八二十九三十月小二十七日起五衆即出家五輩一比丘二比丘尼三式叉摩那四沙彌五沙彌尼三惡八難三惡即三惡道八難者前三即三惡道四長壽天壽五百劫外道得無想定故生其處五北俱盧洲六盲聾瘖啞七世智辨聰謂世人邪智聰利耽著外書不信出世正法八生在佛前佛後此八者皆不得見佛聞法故稱為難也輪王輪王有四金輪王化被四洲銀輪王則政隔北俱盧洲銅輪王則除北俱盧及西牛貨洲鐵輪王則唯贍部洲此四輪王將即大位隨福所感有大輪寶浮空來應則感有金銀銅鐵之異故為四焉梵王居色界初禪二禪中間統小千界四恩一父母恩二衆生恩謂無始劫來一切衆生輪回六道於多生中互為父母故三國王恩四三寶恩三寶是良福田能令衆生出生死苦至涅槃樂三有謂欲界色界無色界衆生有生有死故也六欲天一四王天二忉利天三夜摩天四兜率天五化樂天六他化自在天色無色界天色界即四禪天無色界即四空天聲聞修四諦法證得小乘四果緣覺梵名辟支佛鬘音曼貫華以嚴身首也五濁惡世一衆生濁謂諸衆生不畏惡業果報不修善法二見濁謂邪見增長不修善道三煩惱濁謂諸衆生多諸愛欲貪瞋癡盛惱亂心神四命濁謂人壽轉減百歲者稀以惡業增故三十二十十歲壽數長短不定五劫濁謂刀兵飢饉疾疫三災起時衆生更相殺害也迦旃延此云文飾亦云不定菩薩梵語具云菩提薩埵今人尚略故云菩薩菩提佛道也薩埵此云大心衆生謂有大心入佛道也又薩埵名成衆生謂用佛道成就衆生也須陀洹此云入流謂預入聖人之流是初果聖人也四果一須陀洹二斯陀含三阿那含四阿羅漢五辛蔥蒜韭薤興渠也亦蔥之一類切不可食也梵志此云淨行如此方儒者樗蒱上音樞下音蒲博奕戲也優婆塞此云近事男優婆夷此云近事女謂受齋戒方能親近承事諸佛聖人也亦云近住謂近聖人住也涅槃此云圓寂謂萬德俱圓業障永寂亦云不生不滅以障寂故故不生滅也驕字去聲音叫似食蔥而莖長有稜五辛中凡中空皆屬蔥類或作藠草名出廬山非也有云藠亦山薤之類非也𦵇本草不載以屬蔥收故不別出藠亦不載由無功用故也
